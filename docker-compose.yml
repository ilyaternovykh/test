# Тестовый стенд мониторинга парка HPE ProLiant (DL380p Gen8, iLO) в docker compose.
#
#   docker compose up -d --build
#   Grafana:    http://localhost:3000  (admin / admin)
#   Prometheus: http://localhost:9090
#   Exporter:   http://localhost:9127/metrics
#   Mock iLO:   https://localhost:8443 (для тестов без реального железа)
#
# Для прода: замените mock-ilo на реальные адреса iLO в targets/targets.yaml
# (секреты — через .env, см. .env.example).
services:

  # ---------- фейковый iLO для тестов (не нужен на проде) ----------
  mock-ilo:
    image: python:3.12-slim
    container_name: mock-ilo
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl
      && python3 /app/tests/mock_ilo.py --host 0.0.0.0 --port 8443"
    volumes:
      - ./:/app:ro
    ports:
      - "8443:8443"
    restart: unless-stopped

  # ---------- единый сборщик на весь парк ----------
  ilo-exporter:
    build:
      context: .
      dockerfile: docker/ilo-exporter/Dockerfile
    container_name: ilo-exporter
    restart: unless-stopped
    ports:
      - "9127:9127"
    environment:
      ILO_EXPORTER_CONFIG: /etc/ilo-exporter/targets.yaml
      ILO_EXPORTER_COLLECT_INTERVAL: "60"
      # секреты подставляются из .env (ILO_USER / ILO_PASS)
      ILO_USER: ${ILO_USER:-monitor}
      ILO_PASS: ${ILO_PASS:-secret}
    volumes:
      - ./targets/targets.yaml:/etc/ilo-exporter/targets.yaml:ro
    depends_on:
      - mock-ilo

  # ---------- hpilo-exporter (github.com/hpilo-exporter/hpilo-exporter) ----------
  # Дополнительный сборщик HPBIOS health_at_a_glance (RIBCL XML): вентиляторы,
  # температура, питание, контроллеры/диски, прошивка. Скрейпится Prometheus
  # по схеме ?ilo_host=<IP>; список целей — из единого inventory.ini
  # (targets/hpilo-targets.json, regenerate: ./scripts/gen-targets.sh).
  #
  # ВНИМАНИЕ: upstream-Dockerfile не работает как есть — ENTRYPOINT["hpilo-exporter"]
  # + compose `command` склеиваются в argv без префикса "--" и main.py падает с
  # argparse error. Поэтому пересобираем форк с фиксом: docker/hpilo-exporter/Dockerfile.
  hpilo-exporter:
    image: hpilo-exporter:fixed
    build:
      context: ./docker/hpilo-exporter
    container_name: hpilo-exporter
    restart: unless-stopped
    environment:
      # секреты НЕ в URL/file_sd — только здесь (или override ilo_user/ilo_password
      # per-server через ENV не предусмотрен upstream; для разных паролей — см. README)
      ilo_user: ${ILO_USER:-monitor}
      ilo_password: ${ILO_PASS:-secret}
      # ilo_port НЕ задаём: порт каждой цели приходит параметром ?ilo_port=
      # из targets/hpilo-targets.json (адрес "<iLO-хост>:<порт>" + relabel_configs
      # в prometheus.yml). ENV остался бы только fallback (дефолт 443).
    ports:
      - "9416:9416"
    depends_on:
      - mock-ilo

  # ---------- idrac_exporter (github.com/mrlhansen/idrac_exporter) ----------
  # Redfish-экспортёр (Dell iDRAC, HPE iLO5+, Lenovo XClarity, Supermicro).
  # On-demand proxy-скрейп: GET /metrics?target=<IP/DNS BMC>. Цели и креды —
  # из ЕДИНОГО inventory.ini: ./scripts/gen-targets.sh генерирует
  #   targets/idrac-config.yml   (hosts + креды, монтируется в /etc/prometheus/idrac.yml)
  #   targets/idrac-targets.json (file_sd для Prometheus, job idrac)
  # Креды per-host совпадают с ?target= (ключ hosts в конфиге = хост из URL),
  # fallback — default из ENV IDRAC_DEFAULT_USERNAME/PASSWORD.
  # --config-watch в ENTRYPOINT подхватывает перегенерацию конфига без рестарта.
  # Экспортёр рассчитан на РЕАЛЬНЫЕ iDRAC/BMC (полный Redfish: system, sensors,
  # power, processors, memory, storage, events — все включены в конфиге).
  idrac-exporter:
    build:
      context: ./docker/idrac-exporter
    image: ilo-monitor/idrac-exporter:local
    container_name: idrac-exporter
    restart: unless-stopped
    environment:
      # ENV-подстановка ${VAR} в idrac-config.yml (--config-expand-env);
      # задаём те же дефолты monitor/secret, что у ilo/hpilo, иначе expand
      # дал бы пустые креды и Validate() отверг бы конфиг
      IDRAC_DEFAULT_USERNAME: ${IDRAC_USER:-${ILO_USER:-monitor}}
      IDRAC_DEFAULT_PASSWORD: ${IDRAC_PASS:-${ILO_PASS:-secret}}
    ports:
      - "9348:9348"
    volumes:
      - ./targets/idrac-config.yml:/etc/prometheus/idrac.yml:ro

  # ---------- хранение ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    # ВАЖНО: без этого блока compose молча использует ранее созданный контейнер,
    # и новые volume (например hpilo-targets.json) в него НЕ монтируются —
    # job hpilo есть в prometheus.yml, но целей не видно.
    create: true
    replace: true
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    # env для подстановки ${PROM_ILO_USER}/${PROM_ILO_PASS} в relabel_configs
    # job hpilo -> ?ilo_user=&ilo_password= в URL скрейпа (см. prometheus.yml)
    environment:
      PROM_ILO_USER: ${ILO_USER:-monitor}
      PROM_ILO_PASS: ${ILO_PASS:-secret}
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./targets/hpilo-targets.json:/etc/prometheus/targets/hpilo-targets.json:ro
      - ./targets/idrac-targets.json:/etc/prometheus/targets/idrac-targets.json:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # ---------- визуализация ----------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
