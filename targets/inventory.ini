# ============================================================================
# ЕДИНЫЙ ИНВЕНТАРЬ ПАРКА СЕРВЕРОВ — единственный источник правды про IP и
# имена. Из него генерируются:
#   * targets/targets.yaml        (наш ilo-exporter)
#   * targets/hpilo-targets.json  (hpilo-exporter + Prometheus file_sd)
#   * Grafana-переменная $server  (label_values по этим же target/server)
#
# Формат секции [servers]: <имя_сервера> ansible_host=<IP или DNS> [ключи...]
#   name  — как сервер виден в Grafana/Prometheus (label target/server/host)
#   ip    — адрес iLO (http/https подставляются автоматически)
#   rack / model / site — необязательные метки, попадают в labels цели
#   user / pass — необязательные override-секреты (иначе defaults/.env)
#   collectors — какие коллекторы включить (по умолчанию web,redfish; ribcl для IML/IEL)
#   ilo_version — ilo4|ilo5 (для hpilo-exporter: путь HPBIOS_ROOT)
#
# После правки файла перегенерировать конфиги:
#   ./scripts/gen-targets.sh && docker compose up -d --reload ilo-exporter hpilo-exporter prometheus
# ============================================================================

[defaults]
site=lab
model=dl380p-gen8
collectors=web,redfish
ilo_version=ilo4

[servers]
mock-dl380g8-01 ansible_host=https://mock-ilo:8443 host_header=mock-ilo-1 rack=r01 ribcl=true
