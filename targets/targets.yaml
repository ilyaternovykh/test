# Конфигурация единого сборщика для тестов (docker compose).
# Для прода: скопируйте на реальные iLO и подключите секреты из .env.

listen:
  host: 0.0.0.0
  port: 9127
  path: /metrics
  collect_interval: 60        # сек; полный обход парка из 22 серверов
  http_workers: 8             # параллельность опроса iLO

defaults:
  username: ${ILO_USER}       # подставляется compose из .env
  password: ${ILO_PASS}
  timeout: 15
  verify_tls: false           # iLO отдаёт самоподписанный сертификат
  enabled_collectors: [web, redfish]
  extra_labels:
    model: dl380p-gen8
    site: lab

targets:
  # ------- ТЕСТОВЫЙ ПАРК: 22 «сервера» на одном mock-ilo -------
  # Виртуальный Host (mock-ilo-N) позволяет одному mock-контейнеру эмулировать
  # весь парк с уникальными показаниями датчиков — как на реальном железе.
  - name: mock-dl380g8-01
    url: https://mock-ilo:8443
    host_header: mock-ilo-1
    labels:
      rack: r01
    ribcl_enabled: true       # задел IML/IEL (сработает на реальном железе)
    ribcl_command: "GET IML"

  - name: mock-dl380g8-02
    url: https://mock-ilo:8443
    host_header: mock-ilo-2
    labels: {rack: r01}

