# СГЕНЕРИРОВАНО scripts/gen-targets.sh из targets/inventory.ini — не редактируйте вручную!

listen:
  host: 0.0.0.0
  port: 9127
  path: /metrics
  collect_interval: 60
  http_workers: 8

defaults:
  username: ${ILO_USER}
  password: ${ILO_PASS}
  timeout: 15
  verify_tls: false
  enabled_collectors: [web, redfish]
  # подмена Host разрешена только на тестовом стенде (mock-парк);
  # для реальных целей поле host_header пустое -> Host берётся из URL
  allow_sni_mismatch: true
  extra_labels:
    model: dl380p-gen8
    site: lab

targets:
  - name: mock-dl380g8-01
    url: "https://mock-ilo:8443"
    host_header: mock-ilo-1
    labels: {"rack": "r01", "model": "dl380p-gen8", "site": "lab"}
    enabled_collectors: [web, redfish, ribcl]
    ribcl_enabled: true
    ribcl_command: "GET IML"
